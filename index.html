<!DOCTYPE html>
<html lang="de-AT">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <title>WeCare</title>

    <meta
      name="description"
      content="WeCare: die richtige Unterstützung bei Schlafproblemen, Schmerzen, Stress und Migräne. Ärztlich geführt, in Österreich verfügbar."
    />
    <!-- Keep noindex until the rebuild ships; remove at launch. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph / Twitter Card: controls the link-preview shown when this
         page is shared (Slack, WhatsApp, Telegram, etc.). This is the static
         fallback; once the site is indexable `src/app/usePageTitle.ts` emits
         an absolute `${VITE_SITE_ORIGIN}${OG_IMAGE_PATH}` per route.
         `/banner.png` still carries a "7/10" pill + a person — swap for the
         no-person / no-score version before the first indexable deploy
         (docs/SEO-FOUNDATION.md §51). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WeCare" />
    <meta property="og:title" content="WeCare" />
    <meta
      property="og:description"
      content="WeCare: die richtige Unterstützung bei Schlafproblemen, Schmerzen, Stress und Migräne. Ärztlich geführt, in Österreich verfügbar."
    />
    <meta property="og:image" content="/banner.png" />
    <meta property="og:locale" content="de_AT" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WeCare" />
    <meta
      name="twitter:description"
      content="WeCare: die richtige Unterstützung bei Schlafproblemen, Schmerzen, Stress und Migräne. Ärztlich geführt, in Österreich verfügbar."
    />
    <meta name="twitter:image" content="/banner.png" />

    <link rel="icon" href="/favicon.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- WeCare brand typefaces (WECARE BRAND BOOK 2026):
         Schibsted Grotesk = display / headings · Figtree = body / UI.
         Both OFL, self-hosted from public/fonts/ (@font-face in
         src/styles/fonts.css); no request to Google. Batangas (accent) stays
         commercial and stack-loaded. -->
    <link
      rel="preload"
      href="/fonts/figtree-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/schibsted-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
