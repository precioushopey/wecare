<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <title>WeCare</title>

    <meta
      name="description"
      content="WeCare — finde die richtige Unterstützung bei Schlafproblemen, Schmerzen, Stress und Migräne. Ärztlich geführt, in Österreich verfügbar."
    />
    <!-- Keep noindex until the rebuild ships; remove at launch. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph / Twitter Card — controls the link-preview shown when this
         page is shared (Slack, WhatsApp, Telegram, etc.). Prompted by a
         prototype-share link that had no preview of its own. og:image falls
         back to the favicon (only social art in the repo so far); swap in a
         dedicated 1200×630 banner when one exists. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WeCare" />
    <meta property="og:title" content="WeCare" />
    <meta
      property="og:description"
      content="WeCare — finde die richtige Unterstützung bei Schlafproblemen, Schmerzen, Stress und Migräne. Ärztlich geführt, in Österreich verfügbar."
    />
    <meta property="og:image" content="/favicon.png" />
    <meta property="og:locale" content="de_AT" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WeCare" />
    <meta
      name="twitter:description"
      content="WeCare — finde die richtige Unterstützung bei Schlafproblemen, Schmerzen, Stress und Migräne. Ärztlich geführt, in Österreich verfügbar."
    />
    <meta name="twitter:image" content="/favicon.png" />

    <link rel="icon" href="/favicon.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- WeCare brand typefaces (WECARE BRAND BOOK 2026):
         Schibsted Grotesk = display / headings · Figtree = body / UI.
         Both OFL, self-hosted from public/fonts/ (@font-face in
         src/styles/fonts.css) — no request to Google. Batangas (accent) stays
         commercial and stack-loaded. -->
    <link
      rel="preload"
      href="/fonts/figtree-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/schibsted-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
